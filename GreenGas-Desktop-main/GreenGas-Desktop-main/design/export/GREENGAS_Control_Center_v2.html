/* ---------- Graphiques (SVG, sans bibliothèque) ---------- */
function donut(parts,center,sub){const T=parts.reduce((a,p)=>a+p[1],0)||1,r=42,C=2*Math.PI*r;let acc=0;const seg=parts.filter(p=>p[1]>0).map(([l,v,col])=>{const len=v/T*C,o=`<circle r="${r}" cx="60" cy="60" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}"/>`;acc+=len;return o}).join('');
 return `<div class="dn"><svg viewBox="0 0 120 120" width="132" height="132" role="img" aria-label="${sub||'Répartition'}"><g transform="rotate(-90 60 60)"><circle r="${r}" cx="60" cy="60" fill="none" stroke="#EDF3EC" stroke-width="16"/>${seg}</g><text x="60" y="60" text-anchor="middle" font-size="19" font-weight="700" fill="#222">${center}</text><text x="60" y="76" text-anchor="middle" font-size="10" fill="#5C5C5C">${sub||''}</text></svg><ul class="lgd">${parts.map(([l,v,col])=>`<li><i style="background:${col}"></i><span>${l}</span><b>${fr(v,0)}</b><small>${fr(v/T*100,0)}&nbsp;%</small></li>`).join('')}</ul></div>`}
const hbars=rows=>{const m=Math.max(...rows.map(r=>r[1]),1);return `<div class="hb">${rows.map(([l,v,col,t])=>`<div class="hbr"><span>${l}</span><i><u style="width:${v/m*100}%;background:${col}"></u></i><b>${t}</b></div>`).join('')}</div>`};
function lchart(pts,w=640,h=180){if(!pts.length)return '<div class="empty">Pas encore d\'historique.</div>';const hi=Math.max(...pts.map(p=>p.v))*1.2||1,x=i=>44+i*(w-80)/Math.max(pts.length-1,1),y=v=>h-28-(v/hi)*(h-46);
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Historique"><line x1="30" x2="${w-20}" y1="${h-28}" y2="${h-28}" stroke="#D9DED6"/><polyline fill="none" stroke="#2E7D32" stroke-width="3" stroke-linejoin="round" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i==pts.length-1?6:4.5}" fill="${p.c||'#2E7D32'}"/><text x="${x(i)}" y="${y(p.v)-12}" text-anchor="middle" font-size="13" font-weight="700" fill="#222">${fr(p.v,p.v<10?1:0)}</text><text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="12" fill="#5C5C5C">${p.l}</text>`).join('')}</svg>`}
const histPanel=hc=>`<div class="pn"><div class="sh"><h3>Historique des collectes du bac</h3>${B('simule')}</div>${lchart(hc.slice(0,6).reverse().map(c=>({l:dfr(c.date).slice(0,5),v:c.poids_net_kg,c:['a_verifier','points_valides','points_annules'].includes(c.statut_controle)?'#D68910':'#2E7D32'})))}<p class="ms">Poids net par collecte, en kg. En orange : collecte signalée « à vérifier ».</p></div>`;
/* QR d'illustration : le vrai QR (contenant seulement le code du bac) sera généré dans l'application */
function qr(t){let h=7;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;const n=21,out=[],inF=(x,y)=>(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on;if(inF(x,y)){const ax=x>=n-7?x-n+7:x,ay=y>=n-7?y-n+7:y;on=ax==0||ax==6||ay==0||ay==6||(ax>=2&&ax<=4&&ay>=2&&ay<=4)}else{h=(h*1103515245+12345)>>>0;on=(h>>>16)&1}if(on)out.push(`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`)}return `<svg viewBox="-2 -2 25 25" width="160" height="160" role="img" aria-label="QR code du bac ${t}" style="background:#fff;border-radius:12px;border:1px solid #D9DED6"><g fill="#1B4332">${out.join('')}</g></svg>`}

 const lines=bs.filter(b=>BPOS[b.code]&&b.statut=='actif').map(b=>{const c=sc(b.secteur),[x1,y1]=BPOS[b.code],[x2,y2]=POS[c];return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stOf(c)=='alerte'?'#C0392B':'#1B4332'}" stroke-width="2.5" stroke-dasharray="6 6" opacity=".5" vector-effect="non-scaling-stroke"/>`}).join('');
 return `<svg class="flux" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>${QLB.map(([t,x,y])=>`<span class="ql" style="left:${x}%;top:${y}%">${t}</span>`).join('')}${bs.filter(b=>BPOS[b.code]).map(b=>`<button class="bk ${b.statut} ${b.nb_citoyens_valides>b.nb_foyers_declares?'av':''}" style="left:${BPOS[b.code][0]}%;top:${BPOS[b.code][1]}%" title="${b.code} · ${b.residence}" ${adm?`onclick="ST.bid='${b.id}';show('bac')"`:'tabindex="-1"'}><i></i><span>${b.code}</span></button>`).join('')}`}

 const bs=all.filter(b=>(!f.sec||b.secteur==f.sec)&&(!f.st||b.statut==f.st)&&(!q||(b.code+' '+b.residence).toLowerCase().includes(q)));

 const nv=all.filter(b=>{const l=last(b.code);return l&&l.statut_controle=='a_verifier'}).length,sur=all.filter(b=>b.nb_citoyens_valides>b.nb_foyers_declares).length;

 modal('Modifier · '+u.nom,`<label class="fl">Nom<input id="un" value="${u.nom.replace(/"/g,'&quot;')}"></label><label class="fl">Rôle<select id="ur">${Object.entries(RL).map(([k,l])=>`<option value="${k}"${k==u.role?' selected':''}>${l}</option>`).join('')}</select></label><label class="fl">Bac<select id="ub"><option value="">Aucun</option>${bs.map(b=>`<option${b.code==u.bac_code?' selected':''}>${b.code}</option>`).join('')}</select></label><label class="fl">Compte<select id="ua"><option value="1"${u.actif?' selected':''}>Actif</option><option value="0"${u.actif?'':' selected'}>Désactivé (connexion bloquée)</option></select></label><p class="ms">Un compte n'est jamais supprimé : il est désactivé. La modification est journalisée.</p>`,
 {ok:'Enregistrer',fn:async()=>{await api('PATCH','/utilisateurs/'+id+'/',{nom:$('#un').value.trim()||u.nom,role:$('#ur').value,bac_code:$('#ub').value||null,actif:$('#ua').value=='1'});toast('Compte modifié et journalisé');show('users')}})}

V.tplan=async()=>{const f=ST.tf2||(ST.tf2={date:'',sec:'',st:''}),all=await api('GET','/tournees/'),ts=all.filter(t=>(!f.date||t.date==f.date)&&(!f.sec||t.secteur==f.sec)&&(!f.st||t.statut==f.st)),cnt=k=>all.filter(t=>t.statut==k).length;
 return page('Tournées','Planification et suivi des tournées de collecte.',`<div class="g4" style="margin-bottom:16px">${kpi('Planifiées',cnt('planifiee'),'tournées',pill('planifiee'))}${kpi('En cours',cnt('en_cours'),'tournées',pill('en_cours'))}${kpi('À trier',cnt('collectee'),'tournées',pill('collectee'))}${kpi('Triées',cnt('triee'),'tournées',pill('triee'))}</div>
 ${filt([['date','date',f.date,'Date'],['sec','sel',f.sec,'Tous les secteurs',SECO],['st','sel',f.st,'Tous les statuts',[['planifiee','Planifiée'],['en_cours','En cours'],['collectee','À trier'],['triee','Triée']]]],'tf2','tplan',`<button class="btn" onclick="newTour()">${ic('plus')}Planifier une tournée</button>`)}
 <div class="pn" style="padding:6px 8px">${ts.length?`<table><thead><tr><th>TOURNÉE</th><th>DATE</th><th>SECTEUR</th><th>SITE</th><th>COLLECTEUR</th><th>BACS</th><th>POIDS COLLECTÉ</th><th>STATUT</th></tr></thead><tbody>${ts.map(t=>`<tr><td><span class="cd">${t.code}</span></td><td>${dfr(t.date)}</td><td>${SECL[t.secteur]}</td><td><span class="cd">${t.site_code}</span> <small class="ms">${t.motif_affectation}</small></td><td>${t.collecteur}</td><td>${t.bacs.map(b=>`<span class="cd">${b}</span>`).join(' ')}</td><td>${t.poids_collecte_kg?'<b>'+fr(t.poids_collecte_kg,0)+' kg</b>':'—'}</td><td>${pill(t.statut)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucune tournée ne correspond à ces filtres.</div>'}</div>`)};
async function newTour(){const us=(await api('GET','/utilisateurs/?role=collecteur')).filter(u=>u.actif),bs=(await api('GET','/bacs/')).filter(b=>b.statut=='actif'),ss=await api('GET','/sites/');ST.ntb={bs,ss};
 modal('Planifier une tournée',`<label class="fl">Date<input type="date" id="nd" value="2026-09-13"></label><label class="fl">Secteur<select id="ns" onchange="ntb()">${SECO.map(([s,l])=>`<option value="${s}">${l}</option>`).join('')}</select></label><div id="nsi" class="ms"></div><label class="fl">Collecteur<select id="nc">${us.map(u=>`<option value="${u.id}">${u.nom}</option>`).join('')}</select></label><div class="fl">Bacs de la tournée<div id="nb" class="cbl"></div></div>`,
 {ok:'Planifier',fn:async()=>{await api('POST','/tournees/',{date:$('#nd').value,secteur:$('#ns').value,collecteur_id:$('#nc').value,bac_codes:[...document.querySelectorAll('#nb input:checked')].map(i=>i.value)});toast('Tournée planifiée et journalisée');show('tplan')}});ntb()}
function ntb(){const s=$('#ns').value,sc=Object.keys(SEC).find(k=>SEC[k]==s),st=ST.ntb.ss.find(x=>x.code==sc);$('#nsi').innerHTML=`Destination : <span class="cd">${sc}</span> ${st&&st.statut=='maintenance'?'(en maintenance : le serveur choisira le site de repli)':'(fixée par le serveur selon le secteur)'}`;$('#nb').innerHTML=ST.ntb.bs.filter(b=>b.secteur==s).map(b=>`<label><input type="checkbox" value="${b.code}" checked> ${b.code} · ${b.residence}</label>`).join('')||'<span class="ms">Aucun bac actif dans ce secteur.</span>'}

seed();login();
setInterval(()=>{const a=$('#age');if(a)a.textContent=(+a.textContent+1)%6;if(ME&&['globale','site','alertes'].includes(SC)&&!$('#md').className&&$('#age')&&!(+$('#age').textContent))show(SC,1)},1000);
