  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #1B4332;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1B4332;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <script id="browser-languages-fix">
    // Au démarrage, le moteur web de Flutter crée un Intl.Locale pour chaque langue du navigateur
    // (navigator.languages). Une seule étiquette invalide (« en_US », « C »…) lève
    // « RangeError: Incorrect locale information provided » et l'app reste bloquée sur le splash.
    // On ne garde donc que des étiquettes valides, corrigées si possible, avec le français en secours.
    (function () {
      if (typeof Intl === "undefined" || typeof Intl.Locale !== "function") return;
      var source = navigator.languages || [navigator.language];
      var valid = [];
      for (var i = 0; i < source.length; i++) {
        var tag = String(source[i] || "").split(/[.@]/)[0].replace(/_/g, "-");
        try {
          var locale = new Intl.Locale(tag).toString();
          if (valid.indexOf(locale) < 0) valid.push(locale);
        } catch (e) {
          // étiquette inutilisable : ignorée
        }
      }
      if (valid.length === source.length && valid.every(function (l, j) { return l === source[j]; })) return;
      if (valid.length === 0) valid = ["fr"];
      try {
        Object.defineProperty(navigator, "languages", { get: function () { return valid; }, configurable: true });
        Object.defineProperty(navigator, "language", { get: function () { return valid[0]; }, configurable: true });
      } catch (e) {
        // propriété non redéfinissable : on laisse le navigateur tel quel
      }
    })();
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">

  </picture>
