name: greengas
description: GreenGas - collecte, traçabilité et valorisation des déchets organiques.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  mobile_scanner: ^5.2.3
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ">=6.2.0 <6.3.3"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Polices du desktop (Inter, JetBrains Mono), converties du woff2 en TTF : l'app reste hors ligne.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600

# Icône de l'application : carré 1024x1024 (fond vert forêt #1B4332 du desktop + logo blanc),
# composé depuis assets/images/logo_white.png. Générer : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: "#1B4332"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

# Écran de démarrage (logo blanc sur fond vert forêt).
# Générer avec : dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1B4332"
  image: assets/images/logo_white.png
  color_dark: "#1B4332"
  image_dark: assets/images/logo_white.png
  android: true
  ios: true
  android_12:
    color: "#1B4332"
    image: assets/images/logo_white.png
    color_dark: "#1B4332"
    image_dark: assets/images/logo_white.png
